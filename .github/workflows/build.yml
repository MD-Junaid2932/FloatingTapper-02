name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -qo FloatingTapperV2.zip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - run: gradle :app:assembleDebug
        working-directory: FloatingTapper
      - uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: FloatingTapper/app/build/outputs/apk/debug/app-debug.apk
